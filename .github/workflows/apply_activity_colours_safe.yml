name: Apply safe activity colours

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe colour patch
        run: python scripts/patch_activity_colours_safe.py
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run dashboard contract tests
        env:
          PYTHONPATH: .
        run: pytest -q backend/tests/test_dashboard_contract.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/patch_activity_colours_safe.py
          rm -f .github/workflows/apply_activity_colours_safe.yml
      - name: Commit safe colour update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add safe activity colour bands without changing controls"
          git push origin HEAD:main
