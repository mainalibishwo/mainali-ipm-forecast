name: Strengthen activity chart bands

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strengthen activity chart bands
        run: python scripts/strengthen_activity_chart_bands.py
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run dashboard contract tests
        env:
          PYTHONPATH: .
        run: pytest -q backend/tests/test_dashboard_contract.py
      - name: Remove temporary patch files
        run: |
          rm -f scripts/strengthen_activity_chart_bands.py
          rm -f .github/workflows/strengthen_activity_chart_bands.yml
      - name: Commit stronger activity bands
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Low Medium High chart bands clearly visible"
          git push origin HEAD:main
